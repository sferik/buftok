plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

inherit_mode:
  merge:
    - Include

AllCops:
  Include:
    - .duel.rb
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Metrics/BlockLength:
  Exclude:
    - Rakefile

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TernaryParentheses:
  EnforcedStyle: require_parentheses_when_complex
